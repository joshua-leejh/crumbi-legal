<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crumbi</title><style>
:root{--ink:#0F172A;--soft:#475569;--faint:#94A3B8;--bg:#F8FAFC;--card:#FFFFFF;--line:#E2E8F0;--blue:#3B82F6}
@media (prefers-color-scheme:dark){:root{--ink:#F1F5F9;--soft:#CBD5E1;--faint:#64748B;--bg:#0F172A;--card:#1E293B;--line:#334155;--blue:#60A5FA}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.75;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.bar{height:4px;background:linear-gradient(90deg,#00C4CC,#3B82F6,#7D2AE8)}
.wrap{max-width:720px;margin:0 auto;padding:36px 16px 80px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;margin-bottom:24px}
h1{font-size:1.6rem;line-height:1.3;letter-spacing:-.02em}
.sub{color:var(--faint);font-size:.88rem;margin:6px 0 20px}
.lang{display:flex;gap:8px;margin-bottom:28px}
.lang a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--soft);text-decoration:none;font-size:.9rem}
.lang a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h3{font-size:1.02rem;margin:28px 0 6px}
p,li{font-size:.98rem;color:var(--soft)}
p{margin:6px 0}
ul,ol{padding-left:22px;margin:6px 0}
li{margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:8px 0 4px}
a{color:var(--blue)}
section+section{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:.85rem}
</style></head>
<body><div class="bar"></div><div class="wrap">
<div class="brand">Crumbi</div>
<h1>Drop your daily crumbs</h1>
<p class="sub">Developer: Josh and Steve Co., Ltd. (QUEDDAR)</p>
